<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relooking appartements</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2420;--mut:#7a6e63;--acc:#b8761f;--line:#e8dfd1;--red:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1814;--card:#262019;--ink:#f1e9dd;--mut:#a89b8c;--acc:#e0a04c;--line:#3a3128;--red:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,sans-serif}
.w{max-width:1400px;margin:0 auto;padding:16px}h1{margin:.2em 0;font-size:26px}h2{margin:1.4em 0 .6em;border-bottom:2px solid var(--line);padding-bottom:.3em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub{color:var(--mut)}a{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.danger{color:var(--red)}.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.total{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:17px}.total b{font-size:22px}.total .btn{background:#fff3;color:#fff;border-color:#fff6}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:20px;align-items:start}
figure{margin:0 0 10px}figure img{width:100%;border-radius:10px;display:block}figcaption{font-weight:600;margin:0 0 4px;display:flex;justify-content:space-between}
.ph{border:2px dashed var(--line);border-radius:10px;padding:26px 10px;text-align:center;color:var(--mut);font-size:13px}
.rtool{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.side{position:sticky;top:70px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100vh - 90px);overflow:auto}
.side h3{margin:0 0 8px}.empty{color:var(--mut);font-size:13px}
.it{font-size:14px;display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.it>img{width:120px;height:120px;object-fit:cover;border-radius:6px}
.it select{max-width:100%;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:3px;display:block}.it input[type=number]{width:52px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding-top:10px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.bar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card>img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.card .b{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}.card .t{font-size:13px}.card .v{font-size:12px;color:var(--acc)}.card .p{font-size:18px;font-weight:700;margin-top:auto}.rate{font-size:12px;color:var(--mut)}
.idg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.idg figure{margin:0;cursor:zoom-in}.idg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}.idg figcaption{font-size:12px;color:var(--mut);font-weight:400;display:block;margin-top:3px}.pick{display:flex;flex-wrap:wrap;gap:4px}.pick .btn{padding:3px 9px;font-size:12px}
.cl{background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 24px)}dialog::backdrop{background:#0006}
dialog label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}dialog input,dialog textarea,dialog select{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.recap table{width:100%;border-collapse:collapse;font-size:13px}.recap td,.recap th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
@media(max-width:800px){.cols{grid-template-columns:1fr}.side{position:static;max-height:none}}
#pdfDoc{display:none}
@media print{body.pdf .w,body.pdf dialog{display:none!important}body.pdf #pdfDoc{display:block}body{background:#fff!important;color:#222!important}@page{size:A4;margin:12mm}
#pdfDoc{font:12px/1.4 -apple-system,system-ui,sans-serif;color:#222}#pdfDoc h1{font-size:22px;margin:0 0 2px}#pdfDoc h2{font-size:16px;margin:0 0 8px;border-bottom:2px solid #b8761f;padding-bottom:3px;display:block}
#pdfDoc .rm{break-before:page}#pdfDoc .rm:first-of-type{break-before:auto}#pdfDoc .ph2{display:flex;gap:10px;margin-bottom:10px}#pdfDoc .ph2 figure{flex:1;margin:0}#pdfDoc .ph2 img{width:100%;max-height:230px;object-fit:cover;border-radius:6px}#pdfDoc figcaption{font-weight:700;display:block}
#pdfDoc table{width:100%;border-collapse:collapse}#pdfDoc td,#pdfDoc th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;vertical-align:middle}#pdfDoc tr{break-inside:avoid}#pdfDoc td img{width:48px;height:48px;object-fit:cover;border-radius:4px}#pdfDoc .r{text-align:right;white-space:nowrap}
#pdfDoc .gt{font-size:16px;font-weight:700;text-align:right;margin-top:10px}}

function aptDup(){const a=apt(),n=prompt("Nom de la copie (mêmes pièces et éléments) ?",a.name+' (copie)');if(!n)return;const b=JSON.parse(JSON.stringify(a));b.id=uid();b.name=n;S.apts.push(b);S.cur=b.id;render();save()}
function aptRen(){const n=prompt("Nouveau nom ?",apt().name);if(n){apt().name=n;render();save()}}
function aptDel(){if(S.apts.length<2){alert("Il faut garder au moins un appartement.");return}if(confirm("Supprimer l'appartement « "+apt().name+" » ? Le catalogue d'éléments est conservé.")){S.apts=S.apts.filter(a=>a.id!=S.cur);S.cur=S.apts[0].id;render();save()}}
/* pièces */
async function toData(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(file)})}
function roomNew(){const n=prompt("Nom de la pièce (ex : Chambre 1) ?");if(!n)return;const a=apt(),k=uid();a.rooms.push({k,name:n,avant:'',apres:''});a.sel[k]={};render();save()}
function roomRen(k){const r=apt().rooms.find(r=>r.k==k),n=prompt("Nom ?",r.name);if(n){r.name=n;render();save()}}
function roomDel(k){if(confirm("Supprimer cette pièce et sa sélection ?")){const a=apt();a.rooms=a.rooms.filter(r=>r.k!=k);delete a.sel[k];render();save()}}
async function roomImg(k,w,inp){const f=inp.files[0];if(!f)return;const r=apt().rooms.find(r=>r.k==k),d=await toData(f);if(w=='apres'){const l=prompt("Légende de cette image (ex : thème sauge), facultatif ?")||'';r.apres=apList(r).concat([{src:d,label:l}])}else r[w]=d;render();save()}
function apDel(k,i){const r=apt().rooms.find(r=>r.k==k),l=apList(r).slice();l.splice(i,1);r.apres=l;render();save()}
/* sélection */
function tog(id,k){const s=apt().sel[k]=apt().sel[k]||{};if(s[id])delete s[id];else s[id]=[{q:1,c:{}}];render();save()}
function setQ(k,id,i,v){apt().sel[k][id][i].q=Math.max(1,+v||1);render();save()}
function setC(k,id,i,n,v){apt().sel[k][id][i].c[n]=v;render();save()}
function addLine(k,id,i){const a=apt().sel[k][id],b=a[i];a.splice(i+1,0,{q:1,c:{...chosen(item(id),b.c)}});render();save()}
function delLine(k,id,i){const a=apt().sel[k][id];a.splice(i,1);if(!a.length)delete apt().sel[k][id];render();save()}
function lines(a){const L=[];a.rooms.forEach(r=>Object.entries(a.sel[r.k]||{}).forEach(([id,arr])=>{const it=item(id);if(it)arr.forEach((s,i)=>L.push({r,it,s,i,u:unit(it,s.c)}))}));return L}
/* rendu */
function stars(it){return `<span class="rate">${esc(it.s||'')}</span>`}
const nm=(it,n)=>it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.t.slice(0,n))}</a>`:`<b>${esc(it.t.slice(0,n))}</b>`;
function render(){
 const a=apt();if(!a)return;
 $('aptSel').innerHTML=S.apts.map(x=>`<option value="${x.id}"${x.id==S.cur?' selected':''}>${esc(x.name)}</option>`).join('');$('aptSel').onchange=e=>{S.cur=e.target.value;render();save()};
 $('h1').textContent='Relooking appartement '+a.name;document.title='Relooking appartement '+a.name;
 const L=lines(a);const n=L.reduce((x,l)=>x+l.s.q,0),tot=L.reduce((x,l)=>x+(l.u||0)*l.s.q,0),np=L.filter(l=>!l.u).reduce((x,l)=>x+l.s.q,0);
 $('tt').innerHTML=`Total à acheter : <b>${fmt(tot)}</b> · ${n} article${n>1?'s':''} (${new Set(L.map(l=>l.it.id)).size} références)${np?` · dont ${np} sans prix`:''}`;
 $('rooms').innerHTML=a.rooms.map(r=>{const l=L.filter(x=>x.r.k==r.k);const ap=apList(r);const tile=(src,cap,btn)=>`<figure><figcaption><span>${cap}</span><span>${btn||''}</span></figcaption><img src="${esc(src)}" onclick="zoom('${esc(src)}')" style="cursor:zoom-in"></figure>`;
  const phs=(r.avant?tile(r.avant,'Avant',`<label class="btn" style="font-weight:400">Changer<input type="file" accept="image/*" hidden onchange="roomImg('${r.k}','avant',this)"></label>`):`<figure><figcaption><span>Avant</span><label class="btn" style="font-weight:400">Ajouter<input type="file" accept="image/*" hidden onchange="roomImg('${r.k}','avant',this)"></label></figcaption><div class="ph">Pas encore d'image</div></figure>`)+(ap.length?ap.map((x,i)=>tile(x.src,'Après'+(x.label?' · '+esc(x.label):''),`<button class="btn danger" style="font-weight:400" onclick="apDel('${r.k}',${i})" title="Retirer cette image">×</button>`)).join(''):`<figure><figcaption><span>Après</span></figcaption><div class="ph">Pas encore d'image</div></figure>`);
  return `<section><h2>${esc(r.name)}<span class="rtool"><label class="btn">+ Image après<input type="file" accept="image/*" hidden onchange="roomImg('${r.k}','apres',this)"></label><button class="btn" onclick="roomRen('${r.k}')">Renommer</button><button class="btn danger" onclick="roomDel('${r.k}')">Supprimer la pièce</button></span></h2><div class="cols"><div>${phs}</div><aside class="side"><h3>Articles sélectionnés</h3>${l.length?l.map(({it,s,u,i})=>`<div class="it"><img src="${esc(it.img)}"><div>${nm(it,70)}<div>${stars(it)}</div>${(it.opts||[]).map(o=>{const cur=chosen(it,s.c);return `<label class="sub" style="font-size:12px">${esc(o.n)}</label><select onchange="setC('${r.k}','${it.id}',${i},'${esc(o.n)}',this.value)">${o.v.map(v=>{const c2={...cur,[o.n]:v.l};const ok=avail(it,c2);return `<option${cur[o.n]==v.l?' selected':''}${ok?'':' disabled'}>${esc(v.l)}${ok?'':' (indisponible)'}</option>`}).join('')}</select>`}).join('')}${avail(it,s.c)?'':'<div style="color:var(--red)">Combinaison indisponible</div>'}<div style="margin-top:4px">Qté <input type="number" min="1" value="${s.q}" onchange="setQ('${r.k}','${it.id}',${i},this.value)"> <button class="btn" onclick="addLine('${r.k}','${it.id}',${i})" title="Ajouter le même article dans une autre taille/couleur">+ autre taille / couleur</button></div></div><div style="text-align:right"><b>${pu(u,s.q)}</b><br><button class="btn danger" onclick="delLine('${r.k}','${it.id}',${i})" title="Retirer cette ligne">×</button></div></div>`).join(''):'<div class="empty">Aucun élément. Sélectionne-les dans la liste plus bas.</div>'}<div class="tot"><span>Total ${esc(r.name)}</span><span>${fmt(l.reduce((x,y)=>x+(y.u||0)*y.s.q,0))}</span></div></aside></div></section>`}).join('');
 /* récap */
 const agg={};L.forEach(l=>{const key=l.it.id+'|'+ckey(l.it,l.s.c);(agg[key]=agg[key]||{it:l.it,c:l.s.c,u:l.u,q:0,rooms:[]});agg[key].q+=l.s.q;agg[key].rooms.push(l.r.name)});
 $('recapBody').innerHTML=Object.keys(agg).length?`<table><tr><th></th><th>Élément</th><th>Option</th><th>Pièces</th><th>Qté</th><th>Prix</th></tr>${Object.values(agg).map(g=>`<tr><td><img src="${esc(g.it.img)}" width="44"></td><td>${nm(g.it,70)}</td><td>${esc((g.it.opts||[]).map(o=>chosen(g.it,g.c)[o.n]).join(', '))}</td><td>${esc([...new Set(g.rooms)].join(', '))}</td><td>${g.q}</td><td>${pu(g.u,g.q)}</td></tr>`).join('')}<tr><th colspan="4">Total</th><th>${n}</th><th>${fmt(tot)}</th></tr></table>`:'<p class="empty">Rien de sélectionné pour l\'instant.</p>';
 /* catalogue */
 const cats=['Tout',...[...new Set(S.items.map(x=>x.c))].sort()];
 $('bar').innerHTML=cats.map(c=>`<button class="btn${c==fc?' on':''}" onclick="fc=this.dataset.c;render()" data-c="${esc(c)}">${esc(c)}</button>`).join('')+`<input type="search" id="qs" placeholder="Rechercher…" value="${esc(q)}">`;
 $('qs').oninput=e=>{q=e.target.value;grid(a)};$('qs').onchange=null;grid(a);
}
function grid(a){
 const ql=q.toLowerCase();const Lt=S.items.filter(x=>(fc=='Tout'||x.c==fc)&&(!ql||(x.t+' '+x.opts.map(o=>o.v.map(v=>v.l).join(' ')).join(' ')).toLowerCase().includes(ql)));
 $('cnt').textContent='('+Lt.length+')';
 const groups=fc=='Tout'?[...new Set(Lt.map(x=>x.c))].sort():[fc];
 const pos=window.scrollY;const f=document.activeElement&&document.activeElement.id=='qs';
 $('out').innerHTML=groups.map(g=>{const l=Lt.filter(x=>x.c==g);if(!l.length)return'';return `<h2>${esc(g)} <span class="sub">(${l.length})</span></h2><div class="grid">`+l.map(x=>{const vs=(x.opts||[]).map(o=>o.n+' : '+o.v.map(v=>v.l).join(' / ')).join('<br>');return `<div class="card"><img src="${esc(x.img)}" loading="lazy" onclick="zoom('${esc(x.img)}')" style="cursor:zoom-in"><div class="b"><div class="t"><b>${esc(x.t)}</b></div>${stars(x)}${x.n?`<div class="rate">${esc(x.n)}</div>`:''}<div class="v">${vs}</div><div class="p">${(()=>{const r=range(x);return !r?fq:(r[0]==r[1]?fmt(r[0]):'de '+fmt(r[0])+' à '+fmt(r[1]))})()}</div><div class="pick">${a.rooms.map(r=>`<button class="btn${a.sel[r.k]&&a.sel[r.k][x.id]?' on':''}" onclick="tog('${x.id}','${r.k}')">${esc(r.name)}</button>`).join('')}</div><div class="pick"><button class="btn" onclick="edit('${x.id}')">Modifier</button><button class="btn danger" onclick="del('${x.id}')">Supprimer</button></div></div></div>`}).join('')+'</div>'}).join('');
 if(f){const e=$('qs');e.focus();e.setSelectionRange(e.value.length,e.value.length)}
}
function zoom(src){$('imgBig').src=src;imgDlg.showModal()}
const imgDlg=$('imgDlg');
function ideas(){const cs=[...new Set(IDEAS.map(i=>i.c))];$('ideas').innerHTML=cs.map(c=>`<h3>${esc(c)} <span class="sub">(${IDEAS.filter(i=>i.c==c).length})</span></h3><div class="idg">`+IDEAS.filter(i=>i.c==c).map(i=>`<figure onclick="zoom('${esc(i.img)}')"><img src="${esc(i.img)}" loading="lazy">${i.t?`<figcaption>${esc(i.t)}</figcaption>`:''}</figure>`).join('')+'</div>').join('')}
function del(id){const it=item(id);if(!confirm("Supprimer « "+it.t.slice(0,50)+" » du catalogue et de tous les appartements ?"))return;S.items=S.items.filter(x=>x.id!=id);S.deleted.push(id);S.apts.forEach(a=>Object.values(a.sel).forEach(s=>delete s[id]));render();save()}
/* édition */
const o2t=o=>(o||[]).map(g=>g.n+' : '+g.v.map(v=>v.l+(v.p!=null&&v.p!==''?' = '+v.p:'')).join(' | ')).join('\n');
function t2o(t){return t.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf(':');const n=i>0?s.slice(0,i).trim():'Option',rest=i>0?s.slice(i+1):s;return {n,v:rest.split('|').map(x=>x.trim()).filter(Boolean).map(x=>{const j=x.lastIndexOf('=');if(j>0&&/^\s*\d[\d.,]*\s*$/.test(x.slice(j+1)))return {l:x.slice(0,j).trim(),p:+x.slice(j+1).replace(',','.')};return {l:x}})}}).filter(g=>g.v.length)}
function edit(id){
 const it=id?item(id):{t:'',s:'',n:'',img:'',p:null,c:fc!='Tout'?fc:'Autres',opts:[]};
 $('dTitle').textContent=id?'Modifier l\'article':'Nouvel article';
 $('dBody').innerHTML=`<label>Nom</label><input id="fT" value="${esc(it.t)}"><label>Magasin / fournisseur</label><input id="fS" value="${esc(it.s||'')}"><label>Image (lien ou fichier)</label><input id="fI" value="${esc(it.img&&it.img.startsWith('data:')?'(image importée)':it.img)}"><input type="file" id="fF" accept="image/*"><label>Prix de base (DH), vide si inconnu</label><input id="fP" type="number" value="${it.p==null?'':it.p}"><label>Catégorie</label><input id="fC" list="cl" value="${esc(it.c)}"><datalist id="cl">${[...new Set(S.items.map(x=>x.c))].map(c=>`<option>${esc(c)}`).join('')}</datalist><label>Note</label><input id="fN" value="${esc(it.n||'')}"><label>Options (une ligne par option : Nom : valeur = prix | valeur = prix)</label><textarea id="fO" rows="5" placeholder="Taille : 50x50 = 100 | 50x30 = 100">${esc(o2t(it.opts))}</textarea>`;
 $('dOk').onclick=async()=>{const f=$('fF').files[0];let img=$('fI').value.trim();if(f)img=await toData(f);else if(img=='(image importée)')img=it.img;
  const pv=$('fP').value.trim();const n={...it,t:$('fT').value.trim()||'Sans nom',s:$('fS').value.trim(),img,p:pv===''?null:+pv,c:$('fC').value.trim()||'Autres',n:$('fN').value.trim(),opts:t2o($('fO').value)};if($('fO').value.trim()!=o2t(it.opts).trim()){n.manual=true;if(it.combos){delete n.combos;delete n.def}}
  if(id){Object.assign(it,n)}else{n.id=uid();S.items.push(n)}dlg.close();render();save()};
 dlg.showModal();
}
function pdfExport(){const a=apt(),L=lines(a);if(!L.length){alert("Rien de sélectionné.");return}
 const n=L.reduce((x,l)=>x+l.s.q,0),tot=L.reduce((x,l)=>x+(l.u||0)*l.s.q,0);
 const rooms=a.rooms.map(r=>{const l=L.filter(x=>x.r.k==r.k);const sub=l.reduce((x,y)=>x+(y.u||0)*y.s.q,0);
  const ph=(w,t)=>w=='apres'?apList(r).map(x=>`<figure><figcaption>${t}${x.label?' · '+esc(x.label):''}</figcaption><img src="${esc(x.src)}"></figure>`).join(''):(r[w]?`<figure><figcaption>${t}</figcaption><img src="${esc(r[w])}"></figure>`:'');
  return `<section class="rm"><h2>${esc(r.name)}</h2><div class="ph2">${ph('avant','Avant')}${ph('apres','Après (projet)')}</div>${l.length?`<table><tr><th></th><th>Article</th><th>Détail</th><th class="r">Qté</th><th class="r">Prix unit.</th><th class="r">Total</th></tr>${l.map(({it,s,u})=>`<tr><td><img src="${esc(it.img)}"></td><td>${esc(it.t.slice(0,80))}</td><td>${esc((it.opts||[]).map(o=>chosen(it,s.c)[o.n]).join(' · '))}</td><td class="r">${s.q}</td><td class="r">${pu(u,1)}</td><td class="r">${pu(u,s.q)}</td></tr>`).join('')}<tr><th colspan="5" class="r">Total ${esc(r.name)}</th><th class="r">${fmt(sub)}</th></tr></table>`:'<p>Aucun article.</p>'}</section>`}).join('');
 $('pdfDoc').innerHTML=`<h1>Projet de relooking — ${esc(a.name)}</h1><p>Budget estimé des achats · ${new Date().toLocaleDateString('fr-FR')} · ${n} articles</p><div class="gt" style="text-align:left;margin:6px 0 14px">Total général : ${fmt(tot)}</div>${rooms}<div class="gt">Total général : ${fmt(tot)}</div>`;
 document.body.classList.add('pdf');const done=()=>{document.body.classList.remove('pdf');window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
 setTimeout(()=>window.print(),300)}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='relooking-sauvegarde.json';a.click()}
async function imp(i){const f=i.files[0];if(!f)return;try{S=JSON.parse(await f.text());normS();render();save()}catch(e){alert('Fichier invalide')}}
init();
</script></body></html>
